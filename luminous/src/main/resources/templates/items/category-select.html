<!-- templates/items/category-select.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>카테고리 선택</title>
</head>
<body>
    <h2>카테고리 선택</h2>
    <form th:action="@{/items/register}" method="get">
        <label for="parentCategoryId">카테고리</label>
        <select name="categoryId" id="categoryId" required>
            <!-- 안내문구용 기본 option -->
            <option value="" disabled selected>카테고리를 선택하세요</option>
            <!-- categories 리스트를 순회하며 option 생성 -->
            <option th:each="cat : ${categories}"
                    th:value="${cat.categoryId}"
                    th:text="${cat.categoryName}">
                카테고리
            </option>
        </select>
        <button type="submit">선택</button>
    </form>
    <div th:if="${param.error}">
        <p style="color:red;">잘못된 카테고리입니다.</p>
    </div>
</body>
</html>
