spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/luminous_db
    username: root
    password: 
    driver-class-name: org.mariadb.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

mybatis:
  mapper-locations: classpath:Mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true