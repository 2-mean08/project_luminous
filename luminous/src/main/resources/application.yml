spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/testdb #jdbc:mariadb://localhost:3306/luminous_db
    username: sa #root
    password: 
    driver-class-name: org.h2.Driver #org.mariadb.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect #org.hibernate.dialect.MariaDBDialect